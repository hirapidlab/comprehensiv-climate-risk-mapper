[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "comprehensiv-climate-risk"
version = "0.1.0"
description = "Children-specific environmental health risk scoring for community health programs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Hi Rapid Lab Pvt. Ltd.", email = "suresh@hirapidlab.com" }
]
keywords = [
    "climate-health",
    "children",
    "community-health",
    "screening",
    "global-health",
    "rural-health",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pandas>=1.5",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://hirapidlab.com"
Repository = "https://github.com/hirapidlab/comprehensiv-climate-risk-mapper"
Issues = "https://github.com/hirapidlab/comprehensiv-climate-risk-mapper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
